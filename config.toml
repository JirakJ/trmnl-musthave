# TRMNL Must-have – konfigurace (bez tajemství, tajemství patří do .env)

[location]
name = "Jihlava"
latitude = 49.3961
longitude = 15.5912
timezone = "Europe/Prague"

[streams]
# Kick slugs (část URL za kick.com/)
kick = ["fattypillow", "czechfather", "astatoro", "miken", "czechcloud"]
# Twitch loginy (část URL za twitch.tv/)
twitch = ["arcadebulls", "agraelus", "artemis", "cruelladk", "conducteir77", "oliverovykecy", "rob2628"]

[send]
# TRMNL limit je 12 webhooků/h. Sběrač běží každých 5 min; při změně pošle hned (max 12/h),
# heartbeat po 15 min. Server plugin renderuje nejdřív po 6 min (refresh_interval 360 s, minimum bez TRMNL+).
min_interval_minutes = 5
heartbeat_minutes = 15

[trmnl]
# Číselné id instance privátního pluginu (z URL v TRMNL dashboardu nebo `GET /api/plugin_settings`).
# Spolu s TRMNL_USER_API_KEY (Keychain / prostředí) se data posílají přes autentizované API;
# alternativa je TRMNL_WEBHOOK_UUID z Webhook URL, pak plugin_setting_id není potřeba.
plugin_setting_id = 479481

[server]
# BYOS režim (`python3 -m musthave serve`): zařízení ukazuje na http://<ip-tohoto-stroje>:port
# (captive portál → Advanced → Custom Server). Obrazovka se renderuje lokálně každých refresh_seconds.
port = 8080
refresh_seconds = 300
# format = "png" (1-bit PNG) nebo "bmp" (1-bit BMP, nejstarší podporovaný formát firmware)
format = "png"
# chrome = "/cesta/k/chrome"   # jinak se hledá Google Chrome / Chromium automaticky
