name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests (no network, no Chromium)
        run: uv run --python 3.12 --with pytest --with pillow --with python-liquid pytest -q
